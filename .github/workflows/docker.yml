
name: Check Keycloak

on:
  push:
    branches:
      - main
      - "releases/**"

jobs:
  keycloak-check:
    # Este runner está dentro de WSL2
    runs-on: self-hosted

    steps:

      # ================================================================
      # CHECKOUT
      # ================================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ================================================================
      # CHECK KEYCLOAK
      # ================================================================

      - name: Check Keycloak
        run: |
          echo "========================================"
          echo "Checking Keycloak..."
          echo "========================================"

          KEYCLOAK_URL="http://keycloak.local:8080"
          REALM="devops"

          echo "Keycloak URL: $KEYCLOAK_URL"
          echo "Realm: $REALM"

          echo ""
          echo "Checking Keycloak OIDC endpoint..."

          curl --fail \
            --silent \
            --show-error \
            "$KEYCLOAK_URL/realms/$REALM/.well-known/openid-configuration" \
            > keycloak-response.json

          echo ""
          echo "Keycloak response received successfully."

          echo ""
          echo "Validating issuer..."

          ISSUER=$(python3 -c "
          import json
          with open('keycloak-response.json') as f:
              data = json.load(f)
          print(data.get('issuer', ''))
          ")

          EXPECTED_ISSUER="$KEYCLOAK_URL/realms/$REALM"

          echo "Expected issuer:"
          echo "$EXPECTED_ISSUER"

          echo ""
          echo "Returned issuer:"
          echo "$ISSUER"

          if [ "$ISSUER" != "$EXPECTED_ISSUER" ]; then
            echo ""
            echo "ERROR: Keycloak issuer is not correct."
            exit 1
          fi

          echo ""
          echo "Keycloak validation completed successfully."


      # ================================================================
      # SUCCESS MESSAGE
      # ================================================================

      - name: Keycloak validation successful
        if: success()
        run: |
          echo ""
          echo "========================================"
          echo "       KEYCLOAK OK"
          echo "========================================"
          echo ""
          echo "Keycloak is running correctly."
          echo "Realm: devops"
          echo "URL: http://keycloak.local:8080"
          echo ""
          echo "The GitHub Actions runner can connect"
          echo "successfully to Keycloak."
          echo ""
          echo "========================================"

          
